    const VALID_CREW_JOBS = ['Director', 'Screenplay', 'Story', 'Writer', 'Producer', 'Executive Producer', 'Creator'];
    const MAX_CAST_ORDER = 12;

    function filterCredits(cast = [], crew = []) {
      const map = new Map();
      for (const c of cast) {
        if (c && c.id && c.order < MAX_CAST_ORDER) {
          map.set(c.id, {
            id: c.id,
            name: c.name,
            profile_path: c.profile_path,
            order: c.order,
            role: 'cast',
            character: c.character || '',
          });
        }
      }

      const jobPriority = {
        'Director': 1, 'Screenplay': 2, 'Writer': 3, 'Story': 4,
        'Creator': 5, 'Producer': 6, 'Executive Producer': 7,
      };

      for (const c of crew) {
        if (c && c.id && VALID_CREW_JOBS.includes(c.job)) {
          if (map.has(c.id)) {
            const existing = map.get(c.id);
            const currentJobs = existing.job ? existing.job.split(', ') : [];
            if (!currentJobs.includes(c.job)) {
              currentJobs.push(c.job);
              currentJobs.sort((a, b) => (jobPriority[a] || 99) - (jobPriority[b] || 99));
              existing.job = currentJobs.join(', ');
            }
          } else {
            map.set(c.id, {
              id: c.id,
              name: c.name,
              profile_path: c.profile_path,
              order: MAX_CAST_ORDER + map.size,
              role: 'crew',
              job: c.job,
            });
          }
        }
      }

      return Array.from(map.values()).sort((a, b) => a.order - b.order);
    }

      const nouns = ['fox', 'owl', 'hawk', 'wolf', 'bear', 'lynx', 'stag', 'crow', 'hare', 'viper', 'raven', 'tiger', 'eagle', 'cobra', 'puma', 'falcon', 'otter', 'mantis', 'heron', 'drake', 'shark', 'panther', 'phoenix', 'griffin', 'condor', 'badger', 'crane', 'bison', 'jaguar', 'osprey'];
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      const num = Math.floor(Math.random() * 900) + 100;
      const h = `${adj}-${noun}-${num}`;
      localStorage.setItem('filmtrace-handle', h);
      return h;
    }

      async function fetchPersonDetails(personId) {
        setLoadingStep(true);
        setSearchQuery('');
        try {
          const [pDetails, movieRes, tvRes] = await Promise.all([
            fetch(`${TMDB_BASE}/person/${personId}?api_key=${TMDB_API_KEY}`).then(r => r.json()),
            fetch(`${TMDB_BASE}/person/${personId}/movie_credits?api_key=${TMDB_API_KEY}`).then(r => r.json()),
            fetch(`${TMDB_BASE}/person/${personId}/tv_credits?api_key=${TMDB_API_KEY}`).then(r => r.json()),
          ]);

          // Build deduplicated and sorted movie filmography (highest vote count & popularity first)
          const movieMap = new Map();
          const allMovieRaw = (movieRes.cast || []).concat(movieRes.crew || []);
          for (const f of allMovieRaw) {
            if (f && f.id && f.title) {
              if (!movieMap.has(f.id)) {
                movieMap.set(f.id, f);
              }
            }
          }
          const movies = Array.from(movieMap.values()).sort((a, b) => {
            const voteDiff = (b.vote_count || 0) - (a.vote_count || 0);
            if (voteDiff !== 0) return voteDiff;
            const popDiff = (b.popularity || 0) - (a.popularity || 0);
            if (popDiff !== 0) return popDiff;
            return (b.release_date || '').localeCompare(a.release_date || '');
          });

          // Build deduplicated and sorted TV credits (highest vote count & popularity first)
          const tvMap = new Map();
          const allTvRaw = (tvRes.cast || []).concat(tvRes.crew || []);
          for (const t of allTvRaw) {
            const title = t.name || t.original_name || t.title;
            if (t && t.id && title) {
              if (!tvMap.has(t.id)) {
                tvMap.set(t.id, {
                  ...t,
                  title: title,
                  release_date: t.first_air_date || t.release_date || '',
                });
              }
            }
          }
          const tvShows = Array.from(tvMap.values()).sort((a, b) => {
            const voteDiff = (b.vote_count || 0) - (a.vote_count || 0);
            if (voteDiff !== 0) return voteDiff;
            const popDiff = (b.popularity || 0) - (a.popularity || 0);
            if (popDiff !== 0) return popDiff;
            return (b.release_date || '').localeCompare(a.release_date || '');
          });

          setCurrentPerson({
            id: pDetails.id,
            name: pDetails.name,
            profile_path: pDetails.profile_path,
            biography: pDetails.biography,
            known_for: pDetails.known_for_department,
            birthday: pDetails.birthday,
            place_of_birth: pDetails.place_of_birth,
          });
          setPersonMovies(movies);
          setPersonTvShows(tvShows);
          setCurrentView('person');
          setPersonTab('movies');
        } catch (e) {
          console.error('Error fetching person details:', e);
        } finally {
          setLoadingStep(false);
        }
      }

          setScreen('results');
          triggerCelebration();

          try {
            const timeSec = Math.max(1, Math.round((end - (startTime || end)) / 1000));
            const hops = Math.floor(newPath.length / 2);

            const mySolves = JSON.parse(localStorage.getItem('filmtrace-my-solves') || '[]');
            mySolves.unshift({
              id: 's_' + Date.now(),
              puzzle_date: customPuzzleId || (todayPuzzle ? todayPuzzle.date : new Date().toISOString().split('T')[0]),
              handle,

      async function openProfile(userHandle) {
        setProfileUsername(userHandle);
        setScreen('profile');
        setLoading(true);

        try {
          let localPuzzles = [];
          if (userHandle === handle) {
            localPuzzles = JSON.parse(localStorage.getItem('filmtrace-my-puzzles') || '[]');
          }

          let localSolves = [];
          if (userHandle === handle) {
            localSolves = JSON.parse(localStorage.getItem('filmtrace-my-solves') || '[]');
          }

          let remoteSolves = [];
          try {
            const solvesRes = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard_entries?handle=eq.${userHandle}&order=submitted_at.desc`, {
              headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` }
            });
            remoteSolves = await solvesRes.json();
            if (!Array.isArray(remoteSolves)) remoteSolves = [];
          } catch (e) {}

          const allSolves = [...localSolves, ...remoteSolves.filter(r => !localSolves.some(l => l.id === r.id))];
          const totalSolves = allSolves.length;
          const bestTime = totalSolves > 0 ? Math.min(...allSolves.map(s => s.time_seconds)) : null;
          const fewestClicks = totalSolves > 0 ? Math.min(...allSolves.map(s => (s.path && s.path.length ? s.path.length - 1 : s.hop_count * 2))) : null;

          setProfileData({
            username: userHandle,
            totalSolves,
            bestTime,
            fewestClicks,
            createdCount: localPuzzles.length,
            solves: allSolves.slice(0, 10),
            puzzles: localPuzzles,
          });
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      }

        if (!query || query.length < 2) {

          else setTargetSearchResults([]);
          return;

        try {
          const res = await fetch(`${TMDB_BASE}/search/movie?query=${encodeURIComponent(query)}&api_key=${TMDB_API_KEY}`);
          const data = await res.json();
          const results = (data.results || []).slice(0, 8).map(m => ({
            id: m.id,
            title: m.title,

          else setTargetSearchResults(results);
        } catch (e) {

        }

      async function publishCustomPuzzle() {
        setCreateError('');
        if (!createStartMovie || !createTargetMovie) {
          setCreateError('Please select both a Start Movie and a Target Movie.');
          return;
        }
        if (createStartMovie.id === createTargetMovie.id) {
          setCreateError('Start Movie and Target Movie cannot be the same!');
          return;
        }

        setIsPublishing(true);
        try {
          const puzzleTitle = createTitle.trim() || `${createStartMovie.title} → ${createTargetMovie.title}`;
          const puzzleId = 'cp_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
          const origin = window.location.origin + window.location.pathname;
          const fullUrl = `${origin}?start=${createStartMovie.id}&target=${createTargetMovie.id}&by=${encodeURIComponent(handle)}&title=${encodeURIComponent(puzzleTitle)}`;

          const newEntry = {
            id: puzzleId,
            url: fullUrl,
            title: puzzleTitle,
            creator_handle: handle,
            start_film_id: createStartMovie.id,
            end_film_id: createTargetMovie.id,
            startFilm: createStartMovie,
            endFilm: createTargetMovie,
            created_at: new Date().toISOString(),
          };

          const myPuzzles = JSON.parse(localStorage.getItem('filmtrace-my-puzzles') || '[]');
          myPuzzles.unshift(newEntry);
          localStorage.setItem('filmtrace-my-puzzles', JSON.stringify(myPuzzles.slice(0, 50)));

          const comm = JSON.parse(localStorage.getItem('filmtrace-comm-puzzles') || '[]');
          comm.unshift(newEntry);
          localStorage.setItem('filmtrace-comm-puzzles', JSON.stringify(comm.slice(0, 50)));

          try {
            await fetch(`${SUPABASE_URL}/rest/v1/custom_puzzles`, {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_ANON,
                'Authorization': `Bearer ${SUPABASE_ANON}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
              },
              body: JSON.stringify({
                creator_handle: handle,
                start_film_id: createStartMovie.id,
                end_film_id: createTargetMovie.id,
                title: puzzleTitle,
              })
            });
          } catch (e) {
            console.warn('Supabase remote save:', e);
          }

          setCreatedPuzzleResult(newEntry);
          loadCommunityPuzzles();
        } catch (err) {
          console.error('Publish error:', err);
          setCreateError('Error creating puzzle: ' + (err.message || err));
        } finally {
          setIsPublishing(false);
        }
      }

                              </td>

                                {entry.path ? Math.max(0, entry.path.length - 1) : entry.hop_count * 2}
                              </td>
                            </tr>
                          );
                        })
                      ) : (
                        <tr>
                          <td colSpan={4} className="py-8 text-center text-text-muted">
                            No scores logged today yet. Be the first to solve!
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                <button
                  onClick={() => setShowBrief(true)}
                  className="mt-6 w-full max-w-[260px] py-3 bg-white text-[#0e1114] text-xs font-bold uppercase tracking-wider rounded-[4px] hover:bg-[#e6e6e6] transition-all shadow-md cursor-pointer"
                >
                  Play Today's Puzzle
                </button>
              </div>
            )}

            {/* DAILY PRE-GAME BRIEF MODAL */}
            {showBrief && todayPuzzle && (
              <div 
                onClick={() => setShowBrief(false)}
                className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4"
              >
                <div 
                  onClick={(e) => e.stopPropagation()}
                  className="bg-[#1c242c] border border-[#28323e] p-6 sm:p-8 rounded-[4px] max-w-lg w-full flex flex-col gap-6 shadow-2xl text-left animate-in zoom-in-95 duration-200"
                >
                  <div className="flex items-center justify-between border-b border-[#28323e] pb-3">
                    <div className="flex items-center gap-2">
                      <span className="text-white"><Icons.Clapperboard /></span>
                      <h2 className="text-base font-bold text-white uppercase tracking-wider">
                        Today's Challenge
                      </h2>
                    </div>
                    <button 
                      onClick={() => setShowBrief(false)}
                      className="text-text-muted hover:text-white text-lg cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>

                  {/* Revealed Movie Pair */}
                  <div className="flex items-center justify-center gap-6 py-4 bg-[#0e1114] rounded-[4px] border border-[#28323e]">
                    {/* Start Movie */}
                    <div className="flex flex-col items-center gap-1.5">
                      <span className="text-[10px] font-bold uppercase tracking-widest text-text-secondary bg-[#222b35] px-2 py-0.5 rounded border border-[#28323e]">
                        START
                      </span>
                      <div className="w-16 h-24 relative rounded overflow-hidden bg-[#222b35] border border-[#28323e]">
                        {todayPuzzle.startFilm.poster_path ? (
                          <img src={posterUrl(todayPuzzle.startFilm.poster_path, 'w185')} alt={todayPuzzle.startFilm.title} className="w-full h-full object-cover" />
                        ) : <div className="w-full h-full flex items-center justify-center text-xs">🎬</div>}
                      </div>
                      <span className="text-xs font-bold text-white max-w-[110px] truncate text-center">{todayPuzzle.startFilm.title}</span>
                      <span className="text-[10px] text-text-secondary font-mono">{todayPuzzle.startFilm.year}</span>
                    </div>

                    <div className="flex flex-col items-center gap-1 text-text-muted font-light">
                      <span className="text-xl">⟷</span>
                      <span className="text-[9px] font-mono uppercase font-bold text-text-muted">Connect</span>
                    </div>

                    {/* End Movie */}
                    <div className="flex flex-col items-center gap-1.5">
                      <span className="text-[10px] font-bold uppercase tracking-widest text-white bg-[#222b35] px-2 py-0.5 rounded border border-[#28323e]">
                        END
                      </span>
                      <div className="w-16 h-24 relative rounded overflow-hidden bg-[#222b35] border border-[#28323e]">
                        {todayPuzzle.endFilm.poster_path ? (
                          <img src={posterUrl(todayPuzzle.endFilm.poster_path, 'w185')} alt={todayPuzzle.endFilm.title} className="w-full h-full object-cover" />
                        ) : <div className="w-full h-full flex items-center justify-center text-xs">🎬</div>}
                      </div>
                      <span className="text-xs font-bold text-white max-w-[110px] truncate text-center">{todayPuzzle.endFilm.title}</span>
                      <span className="text-[10px] text-text-secondary font-mono">{todayPuzzle.endFilm.year}</span>
                    </div>
                  </div>

                  {/* Mission Instructions */}
                  <div className="flex flex-col gap-3 text-xs text-text-secondary bg-[#0e1114] p-4 rounded border border-[#28323e] leading-relaxed">
                    <div className="flex items-start gap-2.5">
                      <span className="text-white flex-shrink-0 mt-0.5"><Icons.Target /></span>
                      <span>Connect <strong className="text-white">{todayPuzzle.startFilm.title}</strong> to <strong className="text-white">{todayPuzzle.endFilm.title}</strong>.</span>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="text-[#40bcf4] flex-shrink-0 mt-0.5"><Icons.Zap /></span>
                      <span>Compete by doing it in the fastest time and with the fewest clicks.</span>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="text-text-secondary flex-shrink-0 mt-0.5"><Icons.Clock /></span>
                      <span>Timer begins when you click <strong className="text-white">START GAME</strong>.</span>
                    </div>
                  </div>

                  {/* Launch Action (Clean Solid White) */}
                  <button
                    onClick={handleStartDailyGame}
                    className="w-full py-3.5 bg-white hover:bg-[#e6e6e6] text-[#0e1114] font-black text-sm uppercase tracking-wider rounded-[4px] transition-all shadow-lg cursor-pointer flex items-center justify-center gap-2"
                  >
                    <span>START GAME</span>
                    <Icons.ArrowRight />
                  </button>
                </div>
              </div>
            )}

            {/* COMMUNITY CHALLENGE PRE-GAME BRIEF MODAL */}
            {selectedCommunityPuzzle && (
              <div 
                onClick={() => setSelectedCommunityPuzzle(null)}
                className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4"
              >
                <div 
                  onClick={(e) => e.stopPropagation()}
                  className="bg-[#1c242c] border border-[#28323e] p-6 sm:p-8 rounded-[4px] max-w-lg w-full flex flex-col gap-6 shadow-2xl text-left animate-in zoom-in-95 duration-200"
                >
                  <div className="flex items-center justify-between border-b border-[#28323e] pb-3">
                    <div className="flex items-center gap-2">
                      <span className="text-[#40bcf4]"><Icons.Compass /></span>
                      <h2 className="text-base font-bold text-white uppercase tracking-wider">
                        {selectedCommunityPuzzle.title || 'Community Challenge'}
                      </h2>
                    </div>
                    <button 
                      onClick={() => setSelectedCommunityPuzzle(null)}
                      className="text-text-muted hover:text-white text-lg cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>

                  {/* Creator Badge */}
                  {selectedCommunityPuzzle.creator_handle && (
                    <div className="flex items-center gap-2 text-xs text-text-secondary">
                      <span className="text-text-secondary"><Icons.User /></span>
                      <span>Created by <strong className="text-white font-mono">@{selectedCommunityPuzzle.creator_handle}</strong></span>
                    </div>
                  )}

                  {/* Revealed Movie Pair */}
                  <div className="flex items-center justify-center gap-6 py-4 bg-[#0e1114] rounded-[4px] border border-[#28323e]">
                    {/* Start Movie */}
                    <div className="flex flex-col items-center gap-1.5">
                      <span className="text-[10px] font-bold uppercase tracking-widest text-text-secondary bg-[#222b35] px-2 py-0.5 rounded border border-[#28323e]">
                        START
                      </span>
                      <div className="w-16 h-24 relative rounded overflow-hidden bg-[#222b35] border border-[#28323e]">
                        {selectedCommunityPuzzle.startFilm?.poster_path ? (
                          <img src={posterUrl(selectedCommunityPuzzle.startFilm.poster_path, 'w185')} alt={selectedCommunityPuzzle.startFilm.title || ''} className="w-full h-full object-cover" />
                        ) : <div className="w-full h-full flex items-center justify-center text-xs">🎬</div>}
                      </div>
                      <span className="text-xs font-bold text-white max-w-[110px] truncate text-center">
                        {selectedCommunityPuzzle.startFilm?.title || 'Start Movie'}
                      </span>
                      {selectedCommunityPuzzle.startFilm?.year && (
                        <span className="text-[10px] text-text-secondary font-mono">{selectedCommunityPuzzle.startFilm.year}</span>
                      )}
                    </div>

                    <div className="flex flex-col items-center gap-1 text-text-muted font-light">
                      <span className="text-xl">⟷</span>
                      <span className="text-[9px] font-mono uppercase font-bold text-text-muted">Connect</span>
                    </div>

                    {/* End Movie */}
                    <div className="flex flex-col items-center gap-1.5">
                      <span className="text-[10px] font-bold uppercase tracking-widest text-white bg-[#222b35] px-2 py-0.5 rounded border border-[#28323e]">
                        END
                      </span>
                      <div className="w-16 h-24 relative rounded overflow-hidden bg-[#222b35] border border-[#28323e]">
                        {selectedCommunityPuzzle.endFilm?.poster_path ? (
                          <img src={posterUrl(selectedCommunityPuzzle.endFilm.poster_path, 'w185')} alt={selectedCommunityPuzzle.endFilm.title || ''} className="w-full h-full object-cover" />
                        ) : <div className="w-full h-full flex items-center justify-center text-xs">🎬</div>}
                      </div>
                      <span className="text-xs font-bold text-white max-w-[110px] truncate text-center">
                        {selectedCommunityPuzzle.endFilm?.title || 'End Movie'}
                      </span>
                      {selectedCommunityPuzzle.endFilm?.year && (
                        <span className="text-[10px] text-text-secondary font-mono">{selectedCommunityPuzzle.endFilm.year}</span>
                      )}
                    </div>
                  </div>

                  {/* Mission Instructions */}
                  <div className="flex flex-col gap-3 text-xs text-text-secondary bg-[#0e1114] p-4 rounded border border-[#28323e] leading-relaxed">
                    <div className="flex items-start gap-2.5">
                      <span className="text-white flex-shrink-0 mt-0.5"><Icons.Target /></span>
                      <span>Connect <strong className="text-white">{selectedCommunityPuzzle.startFilm?.title}</strong> to <strong className="text-white">{selectedCommunityPuzzle.endFilm?.title}</strong>.</span>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="text-[#40bcf4] flex-shrink-0 mt-0.5"><Icons.Zap /></span>
                      <span>Compete by doing it in the fastest time and with the fewest clicks.</span>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="text-text-secondary flex-shrink-0 mt-0.5"><Icons.Clock /></span>
                      <span>Timer begins when you click <strong className="text-white">START GAME</strong>.</span>
                    </div>
                  </div>

                  {/* Launch Action (Clean Solid White) */}
                  <button
                    onClick={() => {
                      const cp = selectedCommunityPuzzle;
                      setSelectedCommunityPuzzle(null);
                      loadCustomPuzzlePair(cp.start_film_id, cp.end_film_id, cp.creator_handle, cp.title);
                    }}
                    className="w-full py-3.5 bg-white hover:bg-[#e6e6e6] text-[#0e1114] font-black text-sm uppercase tracking-wider rounded-[4px] transition-all shadow-lg cursor-pointer flex items-center justify-center gap-2"
                  >
                    <span>START GAME</span>
                    <Icons.ArrowRight />
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-[#242c35] bg-[#0e1114] py-6 mt-auto">
            <div className="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-text-muted">
              <div className="flex items-center gap-1.5 text-text-secondary">
                <span>Made with passion and late-night cinema by</span>
                <a 
                  href="https://github.com/adityavc19" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="font-bold text-white hover:text-accent underline underline-offset-2 transition-colors cursor-pointer"
                >
                  Aditya
                </a>
              </div>
              <div className="text-[11px] text-text-muted">Film data powered by TMDb</div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
