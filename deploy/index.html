    const VALID_CREW_JOBS = ['Director', 'Screenplay', 'Story', 'Writer', 'Producer', 'Executive Producer', 'Creator'];
    const MAX_CAST_ORDER = 12;

    function filterCredits(cast = [], crew = []) {
      const map = new Map();
      for (const c of cast) {
        if (c && c.id && c.order < MAX_CAST_ORDER) {
          map.set(c.id, {
            id: c.id,
            name: c.name,
            profile_path: c.profile_path,
            order: c.order,
            role: 'cast',
            character: c.character || '',
          });
        }
      }

      const jobPriority = {
        'Director': 1, 'Screenplay': 2, 'Writer': 3, 'Story': 4,
        'Creator': 5, 'Producer': 6, 'Executive Producer': 7,
      };

      for (const c of crew) {
        if (c && c.id && VALID_CREW_JOBS.includes(c.job)) {
          if (map.has(c.id)) {
            const existing = map.get(c.id);
            const currentJobs = existing.job ? existing.job.split(', ') : [];
            if (!currentJobs.includes(c.job)) {
              currentJobs.push(c.job);
              currentJobs.sort((a, b) => (jobPriority[a] || 99) - (jobPriority[b] || 99));
              existing.job = currentJobs.join(', ');
            }
          } else {
            map.set(c.id, {
              id: c.id,
              name: c.name,
              profile_path: c.profile_path,
              order: MAX_CAST_ORDER + map.size,
              role: 'crew',
              job: c.job,
            });
          }
        }
      }

      return Array.from(map.values()).sort((a, b) => a.order - b.order);
    }

      if (typeof window === 'undefined') return 'cinephile';

      const nouns = ['fox', 'owl', 'hawk', 'wolf', 'bear', 'lynx', 'stag', 'crow', 'hare', 'viper', 'raven', 'tiger', 'eagle', 'cobra', 'puma', 'falcon', 'otter', 'mantis', 'heron', 'drake', 'shark', 'panther', 'phoenix', 'griffin', 'condor', 'badger', 'crane', 'bison', 'jaguar', 'osprey'];
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      const num = Math.floor(Math.random() * 900) + 100;
      const h = `${adj}-${noun}-${num}`;
      localStorage.setItem('filmtrace-handle', h);
      return h;
    }

        setCustomCreator(cCreator);
        setPath(startPath);
        setClickCount(0);
        setStartTime(Date.now());
        setEndTime(null);
        setElapsedSec(0);
        setScreen('game');
        fetchFilmDetails(sFilm.tmdb_id);
      }

      async function onSelectPerson(personId, name) {
        const newPath = [...path, { type: 'person', id: personId, name }];
        setPath(newPath);
        setClickCount(c => c + 1);
        await fetchPersonDetails(personId);
      }

      async function onSelectFilm(filmId, title) {
        const newPath = [...path, { type: 'film', id: filmId, name: title }];
        const newClicks = clickCount + 1;
        setClickCount(newClicks);

        if (targetFilm && filmId === targetFilm.tmdb_id) {
          const end = Date.now();
          setEndTime(end);
          setPath(newPath);
          setScreen('results');

          try {
            const timeSec = Math.max(1, Math.round((end - (startTime || end)) / 1000));
            const hops = Math.floor(newPath.length / 2);

            const mySolves = JSON.parse(localStorage.getItem('filmtrace-my-solves') || '[]');
            mySolves.unshift({
              id: 's_' + Date.now(),
              puzzle_date: customPuzzleId || (todayPuzzle ? todayPuzzle.date : new Date().toISOString().split('T')[0]),
              handle,
              time_seconds: timeSec,
              hop_count: hops,
              path: newPath,
              submitted_at: new Date().toISOString(),
            });
            localStorage.setItem('filmtrace-my-solves', JSON.stringify(mySolves.slice(0, 50)));

            await fetch(`${SUPABASE_URL}/rest/v1/leaderboard_entries`, {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_ANON,
                'Authorization': `Bearer ${SUPABASE_ANON}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
              },
              body: JSON.stringify({
                puzzle_date: todayPuzzle ? todayPuzzle.date : '2026-08-21',
                handle,
                time_seconds: timeSec,
                hop_count: hops,
                path: newPath,
              })
            });
            fetchLeaderboardData(todayPuzzle ? todayPuzzle.date : '2026-08-21');
          } catch (e) {
            console.error('Failed to submit score:', e);
          }
        } else {
          setPath(newPath);
          await fetchFilmDetails(filmId);
        }
      }

      function onRewindTo(idx) {
        const truncated = path.slice(0, idx + 1);
        const node = truncated[truncated.length - 1];
        if (node) {
          setPath(truncated);
          if (node.type === 'film') {
            fetchFilmDetails(node.id);
          } else {
            fetchPersonDetails(node.id);
          }
        }
      }

      async function fetchLeaderboardData(param) {
        try {
          const url = `${SUPABASE_URL}/rest/v1/leaderboard_entries?puzzle_date=eq.${param}&order=time_seconds.asc&limit=15`;
          const res = await fetch(url, {
            headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` }
          });
          const data = await res.json();
          setLeaderboard(Array.isArray(data) ? data : []);
        } catch (e) {
          console.error(e);
        }
      }

      async function openProfile(userHandle) {
        setProfileUsername(userHandle);
        setScreen('profile');
        setLoading(true);

        try {
          let localPuzzles = [];
          if (userHandle === handle) {
            localPuzzles = JSON.parse(localStorage.getItem('filmtrace-my-puzzles') || '[]');
          }

          let localSolves = [];
          if (userHandle === handle) {
            localSolves = JSON.parse(localStorage.getItem('filmtrace-my-solves') || '[]');
          }

          let remoteSolves = [];
          try {
            const solvesRes = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard_entries?handle=eq.${userHandle}&order=submitted_at.desc`, {
              headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` }
            });
            remoteSolves = await solvesRes.json();
            if (!Array.isArray(remoteSolves)) remoteSolves = [];
          } catch (e) {}

          const allSolves = [...localSolves, ...remoteSolves.filter(r => !localSolves.some(l => l.id === r.id))];
          const totalSolves = allSolves.length;
          const bestTime = totalSolves > 0 ? Math.min(...allSolves.map(s => s.time_seconds)) : null;
          const fewestClicks = totalSolves > 0 ? Math.min(...allSolves.map(s => (s.path && s.path.length ? s.path.length - 1 : s.hop_count * 2))) : null;

          setProfileData({
            username: userHandle,
            totalSolves,
            bestTime,
            fewestClicks,
            createdCount: localPuzzles.length,
            solves: allSolves.slice(0, 10),
            puzzles: localPuzzles,
          });
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      }

      async function handleSaveUsername() {
        const u = editUsernameInput.trim().toLowerCase();
        if (!u || !/^[a-z0-9_-]{3,24}$/.test(u)) {
          alert('Username must be 3-24 characters containing only letters, numbers, hyphens, and underscores.');
          return;
        }

        try {
          localStorage.setItem('filmtrace-handle', u);
          setHandle(u);
          setIsEditingProfile(false);
          openProfile(u);
        } catch (e) {
          console.error(e);
        }
      }

      async function searchTmdbMovie(query, isStart = true) {
        if (!query || query.length < 2) {
          if (isStart) setStartSearchResults([]);
          else setTargetSearchResults([]);
          return;
        }

        try {
          const res = await fetch(`${TMDB_BASE}/search/movie?query=${encodeURIComponent(query)}&api_key=${TMDB_API_KEY}`);
          const data = await res.json();
          const results = (data.results || []).slice(0, 8).map(m => ({
            id: m.id,
            title: m.title,
            year: m.release_date ? m.release_date.split('-')[0] : '',
            poster_path: m.poster_path,
          }));

          if (isStart) setStartSearchResults(results);
          else setTargetSearchResults(results);
        } catch (e) {
          console.error(e);
        }
      }

      async function publishCustomPuzzle() {
        setCreateError('');
        if (!createStartMovie || !createTargetMovie) {
          setCreateError('Please select both a Start Movie and a Target Movie.');
          return;
        }
        if (createStartMovie.id === createTargetMovie.id) {
          setCreateError('Start Movie and Target Movie cannot be the same!');
          return;
        }

        setIsPublishing(true);
        try {
          const puzzleTitle = createTitle.trim() || `${createStartMovie.title} → ${createTargetMovie.title}`;
          const puzzleId = 'cp_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
          const origin = window.location.origin + window.location.pathname;
          const fullUrl = `${origin}?start=${createStartMovie.id}&target=${createTargetMovie.id}&by=${encodeURIComponent(handle)}&title=${encodeURIComponent(puzzleTitle)}`;

          const newEntry = {
            id: puzzleId,
            url: fullUrl,
            title: puzzleTitle,
            creator_handle: handle,
            start_film_id: createStartMovie.id,
            end_film_id: createTargetMovie.id,
            startFilm: createStartMovie,
            endFilm: createTargetMovie,
            created_at: new Date().toISOString(),
          };

          const myPuzzles = JSON.parse(localStorage.getItem('filmtrace-my-puzzles') || '[]');
          myPuzzles.unshift(newEntry);
          localStorage.setItem('filmtrace-my-puzzles', JSON.stringify(myPuzzles.slice(0, 50)));

          const comm = JSON.parse(localStorage.getItem('filmtrace-comm-puzzles') || '[]');
          comm.unshift(newEntry);
          localStorage.setItem('filmtrace-comm-puzzles', JSON.stringify(comm.slice(0, 50)));

          try {
            await fetch(`${SUPABASE_URL}/rest/v1/custom_puzzles`, {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_ANON,
                'Authorization': `Bearer ${SUPABASE_ANON}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
              },
              body: JSON.stringify({
                creator_handle: handle,
                start_film_id: createStartMovie.id,
                end_film_id: createTargetMovie.id,
                title: puzzleTitle,
              })
            });
          } catch (e) {
            console.warn('Supabase remote save:', e);
          }

          setCreatedPuzzleResult(newEntry);
          loadCommunityPuzzles();
        } catch (err) {
          console.error('Publish error:', err);
          setCreateError('Error creating puzzle: ' + (err.message || err));
        } finally {
          setIsPublishing(false);
        }
      }

                      <img src={posterUrl(startFilm.poster_path, 'w185')} alt={startFilm.title} className="w-full h-full object-cover" />
                    </div>
                    <span className="text-2xl text-text-muted font-light">&rarr;</span>
                    <div className="w-16 h-24 rounded-[4px] overflow-hidden bg-[#202830] border border-[#2c3440] relative">
                      <img src={posterUrl(targetFilm.poster_path, 'w185')} alt={targetFilm.title} className="w-full h-full object-cover" />
                    </div>
                  </div>

                  <h2 className="text-base sm:text-lg font-semibold text-text-secondary">
                    {startFilm.title} to {targetFilm.title}
                  </h2>
                </div>

                {/* Score Box */}
                <div className="flex flex-col gap-2.5 bg-[#1b2228] border border-[#2c3440] rounded-[4px] p-6 w-full max-w-md shadow-2xl">
                  <span className="text-[11px] font-bold uppercase tracking-widest text-text-secondary text-left">
                    Your Result
                  </span>
                  <div className="flex items-center justify-around py-3">
                    <div className="text-center">
                      <span className="text-[11px] font-bold uppercase tracking-widest text-text-secondary block mb-1">
                        Time
                      </span>
                      <span className="font-mono text-3xl sm:text-4xl font-extrabold text-white">
                        {Math.floor(elapsedSec / 60)}:{String(Math.floor(elapsedSec % 60)).padStart(2, '0')}
                      </span>
                    </div>
                    <div className="w-px h-10 bg-[#2c3440]"></div>
                    <div className="text-center">
                      <span className="text-[11px] font-bold uppercase tracking-widest text-text-secondary block mb-1">
                        Clicks
                      </span>
                      <span className="font-mono text-3xl sm:text-4xl font-extrabold text-accent">
                        {clickCount}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Leaderboard */}
                <div className="flex flex-col gap-3 bg-[#1b2228] border border-[#2c3440] rounded-[4px] p-5 w-full max-w-md">
                  <div className="flex flex-col text-left gap-0.5">
                    <span className="text-sm font-extrabold text-white">Leaderboard</span>
                    <span className="text-[11px] text-text-muted">{customPuzzleId ? 'Fastest solvers for this puzzle' : "Today's fastest chains"}</span>
                  </div>

                  <table className="w-full border-collapse text-xs">
                    <thead>
                      <tr className="border-b border-[#2c3440] text-[10px] uppercase text-text-secondary">
                        <th className="py-2 px-1.5 text-center w-9">Pos</th>
                        <th className="py-2 px-1.5 text-left">Player</th>
                        <th className="py-2 px-1.5 text-right">Time</th>
                        <th className="py-2 px-1.5 text-right">Clicks</th>
                      </tr>
                    </thead>
                    <tbody>
                      {leaderboard.length > 0 ? (
                        leaderboard.slice(0, 10).map((entry, idx) => {
                          const isYou = entry.handle === handle;
                          const rankColors = { 1: '#00e054', 2: '#40bcf4', 3: '#ff8000' };
                          const rankColor = rankColors[idx + 1] || '#667788';
                          const mins = Math.floor(entry.time_seconds / 60);
                          const secs = entry.time_seconds % 60;

                          return (
                            <tr key={entry.id || idx} className={`border-b border-[#2c3440]/50 ${isYou ? 'bg-accent/10' : ''}`}>
                              <td className="py-2 px-1.5 text-center font-mono font-bold" style={{ color: rankColor }}>
                                {idx + 1}
                              </td>
                              <td className="py-2 px-1.5 text-left font-medium">
                                <span className={isYou ? 'text-accent font-bold' : 'text-white'}>
                                  {entry.handle} {isYou ? '(You)' : ''}
                                </span>
                              </td>
                              <td className="py-2 px-1.5 text-right font-mono text-text-secondary">
                                {mins}:{String(secs).padStart(2, '0')}
                              </td>
                              <td className="py-2 px-1.5 text-right font-mono text-text-secondary">
                                {entry.path ? Math.max(0, entry.path.length - 1) : entry.hop_count * 2}
                              </td>
                            </tr>
                          );
                        })
                      ) : (
                        <tr>
                          <td colSpan={4} className="py-4 text-center text-text-muted">
                            Great run! You're the first on this leaderboard.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                {/* Share Box */}
                <div className="flex flex-col gap-2 w-full max-w-md text-left">
                  <span className="text-[10px] font-semibold uppercase tracking-wider text-text-muted">Share</span>
                  <pre className="bg-[#14181c] border border-[#2c3440] rounded-[4px] p-3 text-xs text-text-secondary font-mono whitespace-pre-wrap">
                    {`FILMTRACE\n${Math.floor(elapsedSec / 60)}:${String(Math.floor(elapsedSec % 60)).padStart(2, '0')} * ${clickCount} clicks\n${path.map(p => (p.type === 'film' ? '🎬' : '👤')).join(' > ')}\n${window.location.href}`}
                  </pre>
                  <button
                    onClick={copyShare}
                    className="w-full py-2 bg-transparent text-accent text-xs font-bold uppercase tracking-wider border border-accent rounded-[4px] hover:bg-accent/10 transition-colors cursor-pointer"
                  >
                    {copied ? '✓ Copied!' : 'Copy Result'}
                  </button>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={() => { setScreen('home'); }}
                    className="px-6 py-2.5 bg-transparent text-text-secondary text-xs font-semibold border border-[#2c3440] rounded-[4px] hover:text-white hover:border-text-secondary transition-all cursor-pointer"
                  >
                    &larr; Home
                  </button>
                  <button
                    onClick={() => { setCreatedPuzzleResult(null); setScreen('create'); }}
                    className="px-6 py-2.5 bg-accent text-bg-primary text-xs font-bold uppercase tracking-wider rounded-[4px] hover:bg-accent-dim transition-all cursor-pointer"
                  >
                    + Create Game
                  </button>
                </div>
              </div>
            )}

            {/* SCREEN: LEADERBOARD */}
            {screen === 'leaderboard' && (
              <div className="flex flex-col items-center gap-4 w-full max-w-md mx-auto py-8 text-center">
                <h1 className="text-3xl sm:text-4xl font-black text-white">Leaderboard</h1>
                <p className="text-xs text-text-muted mb-4">Today's fastest chains</p>

                <div className="flex flex-col gap-0 bg-[#1b2228] border border-[#2c3440] rounded-[4px] p-5 w-full shadow-2xl">
                  <table className="w-full border-collapse text-xs">
                    <thead>
                      <tr className="border-b border-[#2c3440] text-[10px] uppercase text-text-secondary">
                        <th className="py-2.5 px-1.5 text-center w-10">Pos</th>
                        <th className="py-2.5 px-1.5 text-left">Player</th>
                        <th className="py-2.5 px-1.5 text-right">Time</th>
                        <th className="py-2.5 px-1.5 text-right">Clicks</th>
                      </tr>
                    </thead>
                    <tbody>
                      {leaderboard.length > 0 ? (
                        leaderboard.map((entry, idx) => {
                          const isYou = entry.handle === handle;
                          const rankColors = { 1: '#00e054', 2: '#40bcf4', 3: '#ff8000' };
                          const rankColor = rankColors[idx + 1] || '#667788';
                          const mins = Math.floor(entry.time_seconds / 60);
                          const secs = entry.time_seconds % 60;

                          return (
                            <tr key={entry.id || idx} className={`border-b border-[#2c3440]/50 ${isYou ? 'bg-accent/10' : ''}`}>
                              <td className="py-2.5 px-1.5 text-center font-mono font-bold" style={{ color: rankColor }}>
                                {idx + 1}
                              </td>
                              <td className="py-2.5 px-1.5 text-left font-medium">
                                <span className={isYou ? 'text-accent font-bold' : 'text-white'}>
                                  {entry.handle} {isYou ? '(You)' : ''}
                                </span>
                              </td>
                              <td className="py-2.5 px-1.5 text-right font-mono text-text-secondary">
                                {mins}:{String(secs).padStart(2, '0')}
                              </td>
                              <td className="py-2.5 px-1.5 text-right font-mono text-text-secondary">
                                {entry.path ? Math.max(0, entry.path.length - 1) : entry.hop_count * 2}
                              </td>
                            </tr>
                          );
                        })
                      ) : (
                        <tr>
                          <td colSpan={4} className="py-8 text-center text-text-muted">
                            No scores logged today yet. Be the first to solve!
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                <button
                  onClick={() => setShowBrief(true)}
                  className="mt-6 w-full max-w-[260px] py-3 bg-accent text-bg-primary text-xs font-bold uppercase tracking-wider rounded-[4px] hover:bg-accent-dim transition-all shadow-[0_0_16px_rgba(0,224,84,0.3)] cursor-pointer"
                >
                  Play Today's Puzzle
                </button>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-[#2c3440] bg-[#14181c] py-6 mt-auto">
            <div className="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-text-muted">
              <div className="flex items-center gap-2">
                <span className="font-semibold text-text-secondary">Filmtrace</span> &mdash; Two films. One trail.
              </div>
              <div className="flex items-center gap-1.5 text-text-secondary">
                <span>Made with ❤️ and too many movie rewatches by</span>
                <a 
                  href="https://github.com/adityavc19" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="font-bold text-white hover:text-accent underline underline-offset-2 transition-colors cursor-pointer"
                >
                  Aditya
                </a>
              </div>
              <div className="text-[11px] text-text-muted">Film data powered by TMDb</div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
