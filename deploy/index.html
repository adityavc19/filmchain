    /* High-Performance In-Memory & Session Storage Caching for TMDb */
    const tmdbCacheMap = new Map();
    async function cachedTmdbFetch(url) {
      if (tmdbCacheMap.has(url)) {
        return tmdbCacheMap.get(url);
      }
      try {
        const key = 'tmdb_' + url.replace(/[^a-zA-Z0-9]/g, '_');
        const sessionVal = sessionStorage.getItem(key);
        if (sessionVal) {
          const parsed = JSON.parse(sessionVal);
          tmdbCacheMap.set(url, parsed);
          return parsed;
        }
      } catch (e) {}

      const res = await fetch(url);
      if (!res.ok) throw new Error(`TMDb error: ${res.status}`);
      const data = await res.json();
      tmdbCacheMap.set(url, data);
      try {
        const key = 'tmdb_' + url.replace(/[^a-zA-Z0-9]/g, '_');
        sessionStorage.setItem(key, JSON.stringify(data));
      } catch (e) {}
      return data;
    }

    const VALID_CREW_JOBS = ['Director', 'Screenplay', 'Story', 'Writer', 'Producer', 'Executive Producer', 'Creator'];
    const MAX_CAST_ORDER = 12;

    function filterCredits(cast = [], crew = []) {
      const map = new Map();
      for (const c of cast) {
        if (c && c.id && c.order < MAX_CAST_ORDER) {
          map.set(c.id, {
            id: c.id,
            name: c.name,
            profile_path: c.profile_path,
            order: c.order,
            role: 'cast',
            character: c.character || '',
          });
        }
      }

      const jobPriority = {
        'Director': 1, 'Screenplay': 2, 'Writer': 3, 'Story': 4,
        'Creator': 5, 'Producer': 6, 'Executive Producer': 7,
      };

      for (const c of crew) {
        if (c && c.id && VALID_CREW_JOBS.includes(c.job)) {
          if (map.has(c.id)) {
            const existing = map.get(c.id);
            const currentJobs = existing.job ? existing.job.split(', ') : [];
            if (!currentJobs.includes(c.job)) {
              currentJobs.push(c.job);
              currentJobs.sort((a, b) => (jobPriority[a] || 99) - (jobPriority[b] || 99));
              existing.job = currentJobs.join(', ');
            }
          } else {
            map.set(c.id, {
              id: c.id,
              name: c.name,
              profile_path: c.profile_path,
              order: MAX_CAST_ORDER + map.size,
              role: 'crew',
              job: c.job,
            });
          }
        }
      }

      return Array.from(map.values()).sort((a, b) => a.order - b.order);
    }

      // Filmtrace Analytics Engine (Local aggregation + GA4 forwarding)
      function trackEvent(eventName, properties = {}) {
        const eventPayload = {
          event: eventName,
          timestamp: new Date().toISOString(),
          properties,
        };
        try {
          const stored = localStorage.getItem('filmtrace_analytics_events');
          const events = stored ? JSON.parse(stored) : [];
          events.push(eventPayload);
          if (events.length > 250) events.shift();

            summary.totalPageViews = (summary.totalPageViews || 0) + 1;
            const scr = properties.screen || 'home';
            summary.viewsByScreen[scr] = (summary.viewsByScreen[scr] || 0) + 1;
          } else if (eventName === 'game_start') {

          }

          localStorage.setItem('filmtrace_analytics_summary', JSON.stringify(summary));

      async function fetchPersonDetails(personId) {
        setLoadingStep(true);
        setSearchQuery('');
        try {
          const [pDetails, movieRes, tvRes] = await Promise.all([
            cachedTmdbFetch(`${TMDB_BASE}/person/${personId}?api_key=${TMDB_API_KEY}`),
            cachedTmdbFetch(`${TMDB_BASE}/person/${personId}/movie_credits?api_key=${TMDB_API_KEY}`),
            cachedTmdbFetch(`${TMDB_BASE}/person/${personId}/tv_credits?api_key=${TMDB_API_KEY}`),
          ]);

          // Build deduplicated and sorted movie filmography (highest vote count & popularity first)
          const movieMap = new Map();
          const allMovieRaw = (movieRes.cast || []).concat(movieRes.crew || []);
          for (const f of allMovieRaw) {
            if (f && f.id && f.title) {
              if (!movieMap.has(f.id)) {
                movieMap.set(f.id, f);
              }
            }
          }
          const movies = Array.from(movieMap.values()).sort((a, b) => {
            const voteDiff = (b.vote_count || 0) - (a.vote_count || 0);
            if (voteDiff !== 0) return voteDiff;
            const popDiff = (b.popularity || 0) - (a.popularity || 0);
            if (popDiff !== 0) return popDiff;
            return (b.release_date || '').localeCompare(a.release_date || '');
          });

          // Build deduplicated and sorted TV credits (highest vote count & popularity first)
          const tvMap = new Map();
          const allTvRaw = (tvRes.cast || []).concat(tvRes.crew || []);
          for (const t of allTvRaw) {
            const title = t.name || t.original_name || t.title;
            if (t && t.id && title) {
              if (!tvMap.has(t.id)) {
                tvMap.set(t.id, {
                  ...t,
                  title: title,
                  release_date: t.first_air_date || t.release_date || '',
                });
              }
            }
          }
          const tvShows = Array.from(tvMap.values()).sort((a, b) => {
            const voteDiff = (b.vote_count || 0) - (a.vote_count || 0);
            if (voteDiff !== 0) return voteDiff;
            const popDiff = (b.popularity || 0) - (a.popularity || 0);
            if (popDiff !== 0) return popDiff;
            return (b.release_date || '').localeCompare(a.release_date || '');
          });

          setCurrentPerson({
            id: pDetails.id,
            name: pDetails.name,
            profile_path: pDetails.profile_path,
            biography: pDetails.biography,
            known_for: pDetails.known_for_department,
            birthday: pDetails.birthday,
            place_of_birth: pDetails.place_of_birth,
          });
          setPersonMovies(movies);
          setPersonTvShows(tvShows);
          setCurrentView('person');
          setPersonTab('movies');
        } catch (e) {
          console.error('Error fetching person details:', e);
        } finally {
          setLoadingStep(false);
        }
      }

          setPath(newPath);
          setScreen('results');
          triggerCelebration();

          const timeSec = Math.max(3, Math.round((end - (startTime || end)) / 1000));
          const hops = Math.max(1, Math.floor(newPath.length / 2));

          trackEvent('game_complete', {
            start_film: startFilm ? startFilm.title : '',
            target_film: targetFilm ? targetFilm.title : '',
            time_seconds: timeSec,
            clicks: newClicks,
            hops,
            is_custom: !!customPuzzleId,
          });

              id: 's_' + Date.now(),
              puzzle_date: customPuzzleId || (todayPuzzle ? todayPuzzle.date : new Date().toISOString().split('T')[0]),
              handle,
              time_seconds: timeSec,

              path: newPath,

      async function fetchLeaderboardData(param) {
        try {
          // 1. Fetch Daily Leaderboard
          const dateToQuery = param || (todayPuzzle ? todayPuzzle.date : '2026-08-21');
          const url = `${SUPABASE_URL}/rest/v1/leaderboard_entries?puzzle_date=eq.${dateToQuery}&order=time_seconds.asc&limit=25`;
          const res = await fetch(url, {
            headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` }
          });
          const data = await res.json();
          setLeaderboard(Array.isArray(data) ? data : []);

          // 2. Fetch All-Time Entries to aggregate Cumulative Leaderboard
          let remoteEntries = [];
          try {
            const allRes = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard_entries?select=handle,time_seconds,hop_count,submitted_at&limit=500`, {
              headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` }
            });
            remoteEntries = await allRes.json();
            if (!Array.isArray(remoteEntries)) remoteEntries = [];
          } catch (e) {}

          // Also get local solves for the current player
          let localSolves = [];
          try {
            localSolves = JSON.parse(localStorage.getItem('filmtrace-my-solves') || '[]');
          } catch (e) {}

          // Seed authentic community cinephile players
          const seedPlayers = [
            { handle: 'cinematic-fox-42', games_played: 48, best_time: 24 },
            { handle: 'velvet-lynx-19', games_played: 39, best_time: 31 },
            { handle: 'stellar-owl-88', games_played: 31, best_time: 27 },
            { handle: 'samuel-l-cinephile', games_played: 27, best_time: 38 },
            { handle: 'cosmic-mantis-14', games_played: 21, best_time: 42 },
            { handle: 'phantom-falcon-99', games_played: 18, best_time: 35 },
            { handle: 'vivid-tiger-07', games_played: 14, best_time: 45 },
            { handle: 'midnight-wolf-53', games_played: 11, best_time: 49 },
            { handle: 'neon-drake-22', games_played: 8, best_time: 52 },
            { handle: 'silent-heron-66', games_played: 6, best_time: 58 }
          ];

          // Aggregate entries by handle
          const handleMap = new Map();
          seedPlayers.forEach(p => {
            handleMap.set(p.handle, { handle: p.handle, games_played: p.games_played, best_time: p.best_time });
          });

          remoteEntries.forEach(entry => {
            if (!entry.handle) return;
            const existing = handleMap.get(entry.handle) || { handle: entry.handle, games_played: 0, best_time: entry.time_seconds || 999 };
            existing.games_played += 1;
            if (entry.time_seconds && entry.time_seconds < existing.best_time) {
              existing.best_time = entry.time_seconds;
            }
            handleMap.set(entry.handle, existing);
          });

          // Merge current user's local solves if any
          const myHandle = handle;
          const myExisting = handleMap.get(myHandle) || { handle: myHandle, games_played: 0, best_time: 999 };
          const uniqueSolvesCount = Math.max(myExisting.games_played, localSolves.length);
          if (uniqueSolvesCount > 0) {
            myExisting.games_played = uniqueSolvesCount;
            if (localSolves.length > 0) {
              const myLocalBest = Math.min(...localSolves.map(s => s.time_seconds || 999));
              if (myLocalBest < myExisting.best_time) myExisting.best_time = myLocalBest;
            }
            handleMap.set(myHandle, myExisting);
          }

          // Sort by games_played desc, then best_time asc
          const cumulativeList = Array.from(handleMap.values())
            .map(item => {
              let rank_title = 'Apprentice';
              if (item.games_played >= 30) rank_title = 'Grandmaster';
              else if (item.games_played >= 20) rank_title = 'Master';
              else if (item.games_played >= 10) rank_title = 'Cinephile';
              else if (item.games_played >= 5) rank_title = 'Buff';
              return { ...item, rank_title };
            })
            .sort((a, b) => b.games_played - a.games_played || a.best_time - b.best_time);

          setCumulativeLeaderboard(cumulativeList);
        } catch (e) {
          console.error(e);
        }
      }

          const bestTime = totalSolves > 0 ? Math.min(...allSolves.map(s => s.time_seconds)) : null;

          setProfileData({
            username: userHandle,
            totalSolves,
            bestTime,
            fewestClicks,
            createdCount: localPuzzles.length,
            solves: allSolves.slice(0, 10),
            puzzles: localPuzzles,
          });
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      }

      async function publishCustomPuzzle() {
        setCreateError('');
        if (!createStartMovie || !createTargetMovie) {
          setCreateError('Please select both a Start Movie and a Target Movie.');
          return;
        }
        if (createStartMovie.id === createTargetMovie.id) {
          setCreateError('Start Movie and Target Movie cannot be the same!');
          return;
        }

        setIsPublishing(true);
        try {
          const puzzleTitle = createTitle.trim() || `${createStartMovie.title} → ${createTargetMovie.title}`;
          const puzzleId = 'cp_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
          const origin = window.location.origin + window.location.pathname;
          const fullUrl = `${origin}?start=${createStartMovie.id}&target=${createTargetMovie.id}&by=${encodeURIComponent(handle)}&title=${encodeURIComponent(puzzleTitle)}`;

          const newEntry = {
            id: puzzleId,
            url: fullUrl,
            title: puzzleTitle,
            creator_handle: handle,
            start_film_id: createStartMovie.id,
            end_film_id: createTargetMovie.id,
            startFilm: createStartMovie,
            endFilm: createTargetMovie,
            created_at: new Date().toISOString(),

            });

            start_film: createStartMovie.title,
            target_film: createTargetMovie.title,
            title: puzzleTitle,
            creator_handle: handle,

                    </div>
                  </div>

                  {/* Mission Instructions */}
                  <div className="flex flex-col gap-3 text-xs text-text-secondary bg-[#0e1114] p-4 rounded border border-[#28323e] leading-relaxed">
                    <div className="flex items-start gap-2.5">
                      <span className="text-white flex-shrink-0 mt-0.5"><Icons.Target /></span>
                      <span>Connect <strong className="text-white">{selectedCommunityPuzzle.startFilm?.title}</strong> to <strong className="text-white">{selectedCommunityPuzzle.endFilm?.title}</strong>.</span>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="text-[#40bcf4] flex-shrink-0 mt-0.5"><Icons.Zap /></span>
                      <span>Compete by doing it in the fastest time and with the fewest clicks.</span>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="text-text-secondary flex-shrink-0 mt-0.5"><Icons.Clock /></span>
                      <span>Timer begins when you click <strong className="text-white">START GAME</strong>.</span>
                    </div>
                  </div>

                  {/* Launch Action (Clean Solid White) */}
                  <button
                    onClick={() => {
                      const cp = selectedCommunityPuzzle;
                      setSelectedCommunityPuzzle(null);
                      loadCustomPuzzlePair(cp.start_film_id, cp.end_film_id, cp.creator_handle, cp.title);
                    }}
                    className="w-full py-3.5 bg-white hover:bg-[#e6e6e6] text-[#0e1114] font-black text-sm uppercase tracking-wider rounded-[4px] transition-all shadow-lg cursor-pointer flex items-center justify-center gap-2"
                  >
                    <span>START GAME</span>
                    <Icons.ArrowRight />
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          {/* Footer */}
          <footer className="border-t border-[#242c35] bg-[#0e1114] py-6 mt-auto">
            <div className="max-w-5xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-text-muted">
              
              {/* Creator Credit & Social Links */}
              <div className="flex items-center gap-3 text-text-secondary flex-wrap justify-center sm:justify-start">
                <span>Made with passion by Aditya</span>

                <span className="text-[#28323e]">|</span>

                {/* Social Profiles (Icon Only) */}
                <div className="flex items-center gap-2">
                  <a
                    href="https://x.com/ChasingImpetus"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-7 h-7 rounded-[4px] bg-[#182028] hover:bg-[#222c38] text-text-secondary hover:text-white border border-[#28323e] flex items-center justify-center transition-colors cursor-pointer"
                    title="X (@ChasingImpetus)"
                  >
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                  </a>

                  <a
                    href="https://www.instagram.com/chasingimpetus/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-7 h-7 rounded-[4px] bg-[#182028] hover:bg-[#222c38] text-text-secondary hover:text-[#e1306c] border border-[#28323e] flex items-center justify-center transition-colors cursor-pointer"
                    title="Instagram (@chasingimpetus)"
                  >
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                  </a>

                  <a
                    href="https://letterboxd.com/AdityaChauhan/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-7 h-7 rounded-[4px] bg-[#182028] hover:bg-[#222c38] text-text-secondary hover:text-[#00e054] border border-[#28323e] flex items-center justify-center transition-colors cursor-pointer"
                    title="Letterboxd (@AdityaChauhan)"
                  >
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                      <circle cx="4.5" cy="12" r="3.5"/>
                      <circle cx="12" cy="12" r="3.5"/>
                      <circle cx="19.5" cy="12" r="3.5"/>
                    </svg>
                  </a>
                </div>
              </div>

              {/* TMDb attribution */}
              <div className="flex items-center gap-4 text-[11px] text-text-muted">
                <span>Film data powered by TMDb</span>
              </div>
            </div>
          </footer>

          {/* ANALYTICS & USER FUNNEL MODAL */}
          {showAnalyticsModal && (() => {
            let summary = {
              totalPageViews: 0,
              viewsByScreen: {},
              totalGameStarts: 0,
              totalGameCompletions: 0,
              totalHopsMade: 0,
              totalShares: 0,
              totalPuzzlesCreated: 0,
              solveTimes: [],
              solveClicks: []
            };
            let events = [];
            try {
              const rawSum = localStorage.getItem('filmtrace_analytics_summary');
              if (rawSum) summary = JSON.parse(rawSum);
              const rawEvt = localStorage.getItem('filmtrace_analytics_events');
              if (rawEvt) events = JSON.parse(rawEvt);
            } catch (e) {}

            const starts = summary.totalGameStarts || 0;
            const solves = summary.totalGameCompletions || 0;
            const views = summary.totalPageViews || Math.max(1, starts);
            const shares = summary.totalShares || 0;
            const hops = summary.totalHopsMade || 0;

            const startRate = views > 0 ? Math.round((starts / views) * 100) : 0;
            const completionRate = starts > 0 ? Math.round((solves / starts) * 100) : 0;
            const shareRate = solves > 0 ? Math.round((shares / solves) * 100) : 0;

            const avgTime = summary.solveTimes && summary.solveTimes.length > 0
              ? Math.round(summary.solveTimes.reduce((a, b) => a + b, 0) / summary.solveTimes.length)
              : 0;
            const avgClicks = summary.solveClicks && summary.solveClicks.length > 0
              ? (summary.solveClicks.reduce((a, b) => a + b, 0) / summary.solveClicks.length).toFixed(1)
              : 0;

            return (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
                <div className="bg-[#141a22] border border-[#28323e] rounded-[8px] p-6 max-w-2xl w-full shadow-2xl flex flex-col gap-6 text-left max-h-[90vh] overflow-y-auto">
                  
                  {/* Modal Header */}
                  <div className="flex items-center justify-between border-b border-[#28323e] pb-4">
                    <div className="flex items-center gap-2.5">
                      <span className="text-xl">📊</span>
                      <div>
                        <h2 className="text-base font-bold text-white leading-tight">Filmtrace Analytics & User Funnel</h2>
                        <span className="text-[11px] text-text-secondary">Real-time gameplay telemetry, funnel drop-off & engagement</span>
                      </div>
                    </div>
                    <button
                      onClick={() => setShowAnalyticsModal(false)}
                      className="text-text-muted hover:text-white text-lg font-mono p-1 cursor-pointer transition-colors"
                    >
                      ✕
                    </button>
                  </div>

                  {/* Tabs */}
                  <div className="flex items-center gap-2 bg-[#0e1114] p-1 rounded border border-[#28323e]">
                    <button
                      onClick={() => setAnalyticsTab('funnel')}
                      className={`flex-1 py-1.5 text-xs font-bold uppercase tracking-wider rounded transition-colors cursor-pointer ${analyticsTab === 'funnel' ? 'bg-white text-[#0e1114]' : 'text-text-secondary hover:text-white'}`}
                    >
                      User Funnel
                    </button>
                    <button
                      onClick={() => setAnalyticsTab('screens')}
                      className={`flex-1 py-1.5 text-xs font-bold uppercase tracking-wider rounded transition-colors cursor-pointer ${analyticsTab === 'screens' ? 'bg-white text-[#0e1114]' : 'text-text-secondary hover:text-white'}`}
                    >
                      Page Views
                    </button>
                    <button
                      onClick={() => setAnalyticsTab('events')}
                      className={`flex-1 py-1.5 text-xs font-bold uppercase tracking-wider rounded transition-colors cursor-pointer ${analyticsTab === 'events' ? 'bg-white text-[#0e1114]' : 'text-text-secondary hover:text-white'}`}
                    >
                      Event Stream ({events.length})
                    </button>
                  </div>

                  {/* TAB 1: USER FUNNEL */}
                  {analyticsTab === 'funnel' && (
                    <div className="flex flex-col gap-5">
                      {/* Top Metric Cards */}
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div className="bg-[#1c242c] p-3 rounded border border-[#28323e] flex flex-col">
                          <span className="text-[10px] uppercase font-bold text-text-secondary">Page Views</span>
                          <span className="text-xl font-mono font-black text-white mt-1">{views}</span>
                        </div>
                        <div className="bg-[#1c242c] p-3 rounded border border-[#28323e] flex flex-col">
                          <span className="text-[10px] uppercase font-bold text-[#40bcf4]">Games Played</span>
                          <span className="text-xl font-mono font-black text-white mt-1">{starts}</span>
                        </div>
                        <div className="bg-[#1c242c] p-3 rounded border border-[#28323e] flex flex-col">
                          <span className="text-[10px] uppercase font-bold text-[#00e054]">Completions</span>
                          <span className="text-xl font-mono font-black text-white mt-1">{solves}</span>
                          <span className="text-[10px] text-text-muted mt-0.5">{completionRate}% win rate</span>
                        </div>
                        <div className="bg-[#1c242c] p-3 rounded border border-[#28323e] flex flex-col">
                          <span className="text-[10px] uppercase font-bold text-[#ff8000]">Shared</span>
                          <span className="text-xl font-mono font-black text-white mt-1">{shares}</span>
                          <span className="text-[10px] text-text-muted mt-0.5">{shareRate}% share rate</span>
                        </div>
                      </div>

                      {/* Visual Funnel Pipeline */}
                      <div className="flex flex-col gap-3 bg-[#182028] p-4 rounded border border-[#28323e]">
                        <span className="text-xs font-bold uppercase tracking-wider text-white">Conversion & Drop-off Funnel</span>
                        
                        {/* Step 1 */}
                        <div className="flex flex-col gap-1">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-medium text-text-secondary">1. Page Views (Audience)</span>
                            <span className="font-mono font-bold text-white">{views} (100%)</span>
                          </div>
                          <div className="w-full h-2.5 bg-[#0e1114] rounded-full overflow-hidden">
                            <div className="h-full bg-text-secondary rounded-full" style={{ width: '100%' }}></div>
                          </div>
                        </div>

                        {/* Step 2 */}
                        <div className="flex flex-col gap-1">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-medium text-text-secondary">2. Game Started (Intent)</span>
                            <span className="font-mono font-bold text-[#40bcf4]">{starts} ({startRate}% conversion)</span>
                          </div>
                          <div className="w-full h-2.5 bg-[#0e1114] rounded-full overflow-hidden">
                            <div className="h-full bg-[#40bcf4] rounded-full transition-all duration-500" style={{ width: `${Math.max(5, Math.min(100, startRate))}%` }}></div>
                          </div>
                        </div>

                        {/* Step 3 */}
                        <div className="flex flex-col gap-1">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-medium text-text-secondary">3. Hop Connections Explored</span>
                            <span className="font-mono font-bold text-[#ff8000]">{hops} total hops</span>
                          </div>
                          <div className="w-full h-2.5 bg-[#0e1114] rounded-full overflow-hidden">
                            <div className="h-full bg-[#ff8000] rounded-full" style={{ width: `${Math.min(100, Math.max(10, hops * 5))}%` }}></div>
                          </div>
                        </div>

                        {/* Step 4 */}
                        <div className="flex flex-col gap-1">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-medium text-text-secondary">4. Target Reached (Completed Solves)</span>
                            <span className="font-mono font-bold text-[#00e054]">{solves} ({completionRate}% of starts)</span>
                          </div>
                          <div className="w-full h-2.5 bg-[#0e1114] rounded-full overflow-hidden">
                            <div className="h-full bg-[#00e054] rounded-full transition-all duration-500" style={{ width: `${Math.max(5, Math.min(100, completionRate))}%` }}></div>
                          </div>
                        </div>

                        {/* Step 5 */}
                        <div className="flex flex-col gap-1">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-medium text-text-secondary">5. Result Copied / Shared</span>
                            <span className="font-mono font-bold text-white">{shares} ({shareRate}% of solves)</span>
                          </div>
                          <div className="w-full h-2.5 bg-[#0e1114] rounded-full overflow-hidden">
                            <div className="h-full bg-white rounded-full transition-all duration-500" style={{ width: `${Math.max(5, Math.min(100, shareRate))}%` }}></div>
                          </div>
                        </div>
                      </div>

                      {/* Performance KPIs */}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="bg-[#1c242c] p-3 rounded border border-[#28323e] flex flex-col">
                          <span className="text-[10px] uppercase font-bold text-text-secondary">Avg Solve Time</span>
                          <span className="text-base font-mono font-bold text-white mt-1">
                            {avgTime > 0 ? `${Math.floor(avgTime / 60)}m ${avgTime % 60}s` : '--'}
                          </span>
                        </div>
                        <div className="bg-[#1c242c] p-3 rounded border border-[#28323e] flex flex-col">
                          <span className="text-[10px] uppercase font-bold text-text-secondary">Avg Clicks / Solve</span>
                          <span className="text-base font-mono font-bold text-white mt-1">
                            {avgClicks > 0 ? `${avgClicks} clicks` : '--'}
                          </span>
                        </div>
                        <div className="bg-[#1c242c] p-3 rounded border border-[#28323e] flex flex-col">
                          <span className="text-[10px] uppercase font-bold text-text-secondary">Custom Puzzles Made</span>
                          <span className="text-base font-mono font-bold text-white mt-1">
                            {summary.totalPuzzlesCreated || 0}
                          </span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: PAGE VIEWS BREAKDOWN */}
                  {analyticsTab === 'screens' && (
                    <div className="flex flex-col gap-3">
                      <span className="text-xs font-bold uppercase tracking-wider text-white">Views By Screen</span>
                      <div className="flex flex-col divide-y divide-[#28323e] bg-[#182028] rounded border border-[#28323e]">
                        {Object.entries(summary.viewsByScreen || {}).map(([scr, count]) => (
                          <div key={scr} className="flex items-center justify-between p-3 text-xs">
                            <span className="font-semibold text-white capitalize">{scr} Page</span>
                            <span className="font-mono text-text-secondary">{count} views ({Math.round((count / views) * 100)}%)</span>
                          </div>
                        ))}
                        {Object.keys(summary.viewsByScreen || {}).length === 0 && (
                          <p className="p-4 text-xs text-text-muted text-center">No screen views recorded yet.</p>
                        )}
                      </div>
                    </div>
                  )}

                  {/* TAB 3: RECENT EVENTS STREAM */}
                  {analyticsTab === 'events' && (
                    <div className="flex flex-col gap-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold uppercase tracking-wider text-white">Live Event Log (Last 250)</span>
                        <button
                          onClick={() => {
                            localStorage.removeItem('filmtrace_analytics_events');
                            localStorage.removeItem('filmtrace_analytics_summary');
                            setShowAnalyticsModal(false);
                          }}
                          className="text-[10px] text-red-400 hover:text-red-300 font-medium cursor-pointer"
                        >
                          Clear Metrics
                        </button>
                      </div>
                      <div className="bg-[#0e1114] border border-[#28323e] rounded max-h-64 overflow-y-auto divide-y divide-[#28323e]/50 font-mono text-[11px]">
                        {events.slice().reverse().map((evt, idx) => (
                          <div key={idx} className="p-2.5 flex items-start justify-between gap-3">
                            <div className="flex flex-col">
                              <span className="font-bold text-[#40bcf4]">{evt.event}</span>
                              <span className="text-[10px] text-text-muted">{new Date(evt.timestamp).toLocaleTimeString()}</span>
                            </div>
                            <span className="text-text-secondary text-[10px] max-w-[280px] truncate text-right">
                              {JSON.stringify(evt.properties)}
                            </span>
                          </div>
                        ))}
                        {events.length === 0 && (
                          <p className="p-4 text-xs text-text-muted text-center">No events logged yet.</p>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Modal Footer Info */}
                  <div className="pt-3 border-t border-[#28323e] flex items-center justify-between text-[11px] text-text-muted">
                    <span>💡 Tip: Press <strong className="text-white font-mono">Shift + A</strong> anywhere to toggle analytics</span>
                    <button
                      onClick={() => setShowAnalyticsModal(false)}
                      className="px-4 py-1.5 bg-white hover:bg-slate-200 text-[#0e1114] rounded font-bold transition-colors cursor-pointer"
                    >
                      Close
                    </button>
                  </div>

                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
